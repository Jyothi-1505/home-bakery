<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/logo.png">

    <title>Coming Soon | Bakers Corner</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href=".assets/css/common.css">

    <!-- Coming Soon CSS -->
    <link rel="stylesheet" href="coming-soon.css">

</head>


<body>

<main class="coming-page">

    <div class="coming-card">


        <!-- =========================================
             CARD HEADER
        ========================================== -->

        <div class="coming-card-header">

            <!-- LOGO + WEBSITE NAME -->

            <a
                class="brand-logo"
                href="index.html"
                aria-label="Bakers Corner Home"
            >

                <div class="brand-logo-image">

                    <img
                        src="assets/images/logo.png"
                        alt="Bakers Corner logo"
                    >

                </div>


                <div class="brand-logo-text-wrapper">

                    <span class="brand-logo-bakers">
                        Bakers
                    </span>

                    <span class="brand-logo-corner">
                        Corner
                    </span>

                </div>

            </a>


            <!-- DARK MODE + RTL -->

            <div class="header-actions">

                <button
                    class="header-control-button"
                    id="theme-toggle"
                    type="button"
                    aria-label="Toggle dark mode"
                    title="Dark mode"
                >
                    <i data-lucide="moon-star"></i>
                </button>


                <button
                    class="header-control-button"
                    id="rtl-toggle"
                    type="button"
                    aria-label="Switch to RTL layout"
                    title="RTL"
                >
                    RTL
                </button>

            </div>

        </div>



        <!-- =========================================
             COMING SOON CONTENT
        ========================================== -->

        <div class="coming-content">


            <!-- DECORATIVE ICON -->

            <div class="coming-icon">

                <i data-lucide="cake-slice"></i>

            </div>


            <!-- EYEBROW -->

            <span class="coming-eyebrow">
                COMING SOON / BAKERS CORNER
            </span>


            <!-- HEADING -->

            <h1>
                Something
                <em>delicious</em>
                is coming.
            </h1>


            <!-- DESCRIPTION -->

            <p>
                We're putting the finishing touches on something
                special. A little more time in the oven and
                Bakers Corner will be ready for you.
            </p>


            <!-- BUTTON -->

            <a
                href="index.html"
                class="coming-home-button"
            >

                BACK TO HOME

                <i data-lucide="arrow-up-right"></i>

            </a>


            <!-- BOTTOM -->

            <div class="coming-bottom">

                <span></span>

                <p>
                    FOR EVERY BAKER IN YOU
                </p>

                <span></span>

            </div>

        </div>

    </div>

</main>


<script>
    lucide.createIcons();
</script>

<script src="assets/js/common.js"></script>

</body>

</html>
